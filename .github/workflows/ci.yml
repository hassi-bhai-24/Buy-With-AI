# Buy with AI — CI: backend pytest, frontend typecheck + build, Playwright E2E.
# E2E needs the dev servers: Playwright's webServer config (see
# frontend/playwright.config.ts) starts a seeded backend on :8000 and
# the Vite dev server on :3000, then runs the Chromium suite.
# No secrets are used anywhere: the stack is zero-budget (local Ollama
# optional, DuckDuckGo/Nominatim/Open Food Facts/Frankfurter free tiers).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Run pytest
        run: backend/.venv/bin/python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc -b
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore
