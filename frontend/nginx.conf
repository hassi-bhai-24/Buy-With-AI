# Nginx config for the Buy with AI PWA: static files + /api proxy.
# The CSP meta tag lives in index.html; no CSP header is set here so the
# single in-document policy is the only one enforced.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + SSE stream proxy to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: no buffering, long-lived connection.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache aggressively; index.html itself is never cached
    # by this rule because try_files serves it via the location / block.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
